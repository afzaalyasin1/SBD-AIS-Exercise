networks:
  web:
    name: web
  intercom:
    name: intercom

volumes:
  order_pg_vol:
  order_minio_vol: #Added
  

services:
  traefik:
    image: "traefik:v3.5.2"
    security_opt:
      - no-new-privileges:true
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web

  orderservice:
    build: .
    restart: unless-stopped
    command: [ "/app/ordersystem" ]
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orders.rule=Host(`orders.localhost`)"
      - "traefik.http.routers.orders.entrypoints=web"
      - "traefik.http.services.orders.loadbalancer.server.port=3000"
    environment:
      - POSTGRES_DB=order
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_TCP_PORT=5555
      - DB_HOST=order-postgres
      - S3_ACCESS_KEY_ID=root
      - S3_SECRET_ACCESS_KEY=verysecret
      - S3_ENDPOINT=order-minio:8500
    networks:
      - intercom
      - web
    depends_on:
    - order-postgres
    - order-minio

  sws:
    image: joseluisq/static-web-server:latest
    environment:
      - SERVER_PORT=80
      - SERVER_ROOT=/public
    volumes:
      - ./frontend:/public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sws.rule=Host(`localhost`)"
      - "traefik.http.routers.sws.entrypoints=web"
    networks:
      - intercom
      - web

  order-postgres:
    image: postgres:18
    volumes:
      - order_pg_vol:/var/lib/postgresql/data
    restart: always
    networks:
      - intercom
    ports:
      - "5555:5555"
    environment:
      - POSTGRES_DB=order
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - PGPORT=5555
      
  order-minio:
#  use minio/minio:latest as image
    image: minio/minio:latest
    # expose 8500
    ports:
      - "8500:8500" # API Port (For VS Code and Go Code)
      - "9001:9001" # Console Port (For Web Browser)
    # add to network intercom
    networks:
      - intercom
    # use the following commands: "server", "--address", ":8500", "/data"
    # Added --console-address to make the Web UI accessible
    command: ["server", "--address", ":8500", "--console-address", ":9001", "/data"]
    # Map the datavolume
    volumes:
      - order_minio_vol:/data
     # set environment variables MINIO_ROOT_USER and MINIO_ROOT_PASSWORD
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=verysecret
